<div class="contact-form" id="contactform">
    <form method="POST" id="form" enctype="multipart/form-data">
      <input type="hidden" name="access_key" value="5469dc3e-6ca5-42c7-8ccf-86163ae7e0c0">

      <div class="form-row">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-row">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-row">
        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <div class="form-row">
        <label for="attachment">Upload files:</label>
        <input
          type="file"
          id="attachment"
          name="attachment"
          multiple
          accept="image/*,video/mp4,application/pdf,.doc,.docx"
        >
        <small id="file-status">Images, MP4 videos, PDFs, and documents. You can select multiple files.</small>
      </div>

      <button type="submit">Submit</button>
      <div id="result"></div>
    </form>
  </div>

  <script
    src="https://api.formbeep.com/v1/s/formbeep.js?v=attachment-session-1"
    data-api-key="fbp_FYjXSbBks7ar1FFd6fqHLSGIlh0n">
  </script>

  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');
    const attachment = document.getElementById('attachment');
    const fileStatus = document.getElementById('file-status');

    attachment.addEventListener('change', function () {
      const files = Array.from(attachment.files);

      if (!files.length) {
        fileStatus.textContent = 'Images, MP4 videos, PDFs, and documents. You can select multiple files.';
        return;
      }

      const totalSize = files.reduce((sum, file) => sum + file.size, 0);
      fileStatus.textContent =
        `${files.length} file${files.length === 1 ? '' : 's'} selected — ` +
        `${(totalSize / 1024 / 1024).toFixed(1)} MB total`;
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(form);

      // Web3Forms Free does not support attachments.
      // FormBeep has already uploaded its temporary private copy in the background.
      formData.delete('attachment');

      result.textContent = 'Please wait...';

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {
          Accept: 'application/json'
        },
        body: formData
      })
        .then(async (response) => {
          const data = await response.json();

          if (response.ok) {
            result.textContent = 'Your message has been sent. Thanks!';
          } else {
            result.textContent = data.message || 'Something went wrong.';
          }
        })
        .catch(() => {
          result.textContent = 'Something went wrong. Please try again.';
        })
        .then(() => {
          form.reset();
          fileStatus.textContent = 'Images, MP4 videos, PDFs, and documents. You can select multiple files.';
        });
    });
  </script>
