<div class="contact-form" id="contactform">
    <form method="POST" id="form" enctype="multipart/form-data">
      <input type="hidden" name="access_key" value="5469dc3e-6ca5-42c7-8ccf-86163ae7e0c0">

      <div class="form-row">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-row">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-row">
        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <div class="form-row">
        <label for="attachment">Upload an image:</label>
        <input
          type="file"
          id="attachment"
          name="attachment"
          accept="image/jpeg,image/png"
        >
      </div>

      <button type="submit">Submit</button>
      <div id="result"></div>
    </form>
  </div>

  <script
    src="https://api.formbeep.com/v1/s/formbeep.js"
    data-api-key="fbp_FYjXSbBks7ar1FFd6fqHLSGIlh0n">
  </script>

  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      result.innerHTML = 'Please wait...';

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {
          'Accept': 'application/json'
        },
        body: formData
      })
        .then(async (response) => {
          const data = await response.json();

          if (response.ok) {
            result.innerHTML = 'Your message has been sent. Thanks!';
          } else {
            result.innerHTML = data.message;
          }
        })
        .catch(() => {
          result.innerHTML = 'Something went wrong. Please try again.';
        })
        .then(() => {
          form.reset();
        });
    });
  </script>
